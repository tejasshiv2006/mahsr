pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    includeBuild("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile()

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    try {
        // Configure autolinking with explicit command and working directory
        def command = [
            "node",
            "node_modules/@react-native/cli/build/bin.js",
            "config"
        ]
        ex.autolinkLibrariesFromCommand(command)
    } catch (Exception e) {
        println("Autolinking warning: ${e.message}")
    }
}

rootProject.name = 'MAHSR Connect One'

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)